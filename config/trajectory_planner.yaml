trajectory_planner:
  ros__parameters:
    # Inputs and exported files.
    map_yaml: ''
    # Empty paths default to <input_stem>_clean.yaml/.pgm.
    clean_map_yaml: ''
    clean_map_image: ''
    output_csv: ''
    preview_png: ''
    detailed_csv: false

    # ROS frame and topics.
    frame_id: map
    map_topic: /map
    path_topic: /planned_trajectory
    speed_topic: /planned_speeds
    trajectory_data_topic: /planned_trajectory_data
    trajectory_marker_topic: /planned_trajectory_marker
    centerline_marker_topic: /planned_centerline_marker

    # Vehicle geometry and trajectory sampling (metres).
    spacing: 0.20
    centerline_smoothing: 0.25
    vehicle_width: 0.30
    wall_margin: 0.05
    # Minimum feasible vehicle-center turning radius; 0 disables the constraint.
    # Current vehicle measured turning diameter is approximately 1.8 m.
    min_turning_radius: 0.90
    # Fill only occupied components this small and fully enclosed by free space.
    max_occupied_speckle_area: 2

    # Velocity and acceleration limits (m/s and m/s^2).
    max_speed: 6.0
    min_speed: 0.5
    max_lateral_accel: 7.0
    max_accel: 3.0
    max_decel: 6.0
    lateral_accel_safety_factor: 0.90
    front_grip_factor: 1.00
    rear_grip_factor: 0.95
    drive_front_fraction: 0.00
    brake_front_fraction: 0.60

    # Racing-line optimization.
    curvature_weight: 1.0
    curvature_smooth_weight: 0.35
    length_weight: 0.04
    offset_smooth_weight: 0.15
    center_weight: 0.001
    corridor_fraction: 0.92
    max_optimization_iterations: 100
    max_velocity_iterations: 100
    time_optimization_modes: 8
    max_time_optimization_iterations: 25
    time_optimization_passes: 2
    time_optimization_step: 0.12
    time_offset_regularization: 0.015

    # Optional start/orientation hint; NaN means automatic.
    seed_x: .nan
    seed_y: .nan
    seed_yaw: .nan
    # auto | clockwise | counterclockwise (ROS world x-y coordinates).
    direction: auto
    reverse: false
